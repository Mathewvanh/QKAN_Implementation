# Configuration for KAN Optimization Comparison on CIFAR-10

experiment_name: "CIFAR10_KAN_OptComparison"
random_seed: 42
num_epochs: 50 # Might need more epochs than MNIST
results_dir: "results_cifar10"

dataset:
  name: "cifar10"
  task_type: "classification"
  data_path: "./data" # Path where torchvision will download/look for CIFAR-10
  primary_metric: "accuracy" # Default for classification

# Define model and parameters to search
model_type: "FixedKAN"

parameter_grid: # Grid specifically for FixedKAN on CIFAR-10
  default:
    max_degree: [3, 5]
    hidden_size: [64, 128] # Larger hidden sizes likely needed
    learning_rate: [0.001, 0.0005] # Potentially lower LR
  quick:
    max_degree: [3]
    hidden_size: [64]
    learning_rate: [0.001]

# List of KAN optimization methods to compare (optional, defaults to all)
# methods_to_run: ["QUBO", "GreedyHeuristic"] 