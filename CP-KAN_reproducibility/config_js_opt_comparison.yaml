# Configuration for Jane Street Optimization Comparison

experiment_name: "JaneStreet_OptimizationComparison"
random_seed: 42
num_epochs: 50 # Default number of training epochs
results_dir: "optimization_results_js" # Relative to script location

# Changed 'data' to 'dataset' and added 'name' key
dataset:
  name: "jane_street" # Added dataset name for dispatching
  data_path: "~/Interning/Kaggle/jane_street_kaggle/jane-street-real-time-market-data-forecasting/train.parquet/"
  n_rows: 200000
  train_ratio: 0.7
  feature_cols: auto # Use 'auto' to use default [feature_00, ..., feature_78] or specify list
  target_col: "responder_6"
  weight_col: "weight"
  date_col: "date_id"
  task_type: "regression" # Explicitly add task type
  # primary_metric: "r2" # Optional: Explicitly set, otherwise defaults to r2 for regression

parameter_grid: # Grid for hyperparameter search
  default:
    max_degree: [5, 7, 9]
    hidden_size: [20, 24]
    learning_rate: [0.01, 0.005] # Renamed from run_tuning.py's higher rates
  quick:
    max_degree: [7]
    hidden_size: [20]
    learning_rate: [0.005]
  full:
    max_degree: [5, 7, 9]
    hidden_size: [16, 20, 24, 28]
    learning_rate: [0.01, 0.005, 0.001]

# Note: 'hidden_degree' removed as it was unused when skip_qubo_for_hidden=False
