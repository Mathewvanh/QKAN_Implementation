# CP-KAN_reproducibility/configs/comparisons/config_mnist_compare.yaml

experiment_name: "MNIST_All_Models_Compare"
random_seed: 42
num_epochs: 10 # Short epochs for broad test
results_dir: "results/mnist_compare_all_models"
methods_to_run: 
  - "FixedKAN"
  - "MLP"
  # - "XGBoost" # Removed
  - "LightGBM" # Keeping LightGBM for now
  - "WaveKAN"
  - "FourierKAN"
  # - "JacobiKAN" 
  # - "ChebyKAN"
  # - "TaylorKAN"
  # - "RBFKAN"

dataset:
  name: "mnist"
  task_type: "classification"
  data_path: "./data"
  primary_metric: "accuracy"
  num_classes: 10
  optimize_sample_size: 5000 # Used by KAN optimize step

# Grid search parameters, structured by model type
parameter_grids:
  FixedKAN: 
    default:
      max_degree: [3]
      hidden_size: [64]
      learning_rate: [0.001]
  MLP: 
    default:
      mlp_hidden_layers: [[64]]
      mlp_activation: ['ReLU']
      learning_rate: [0.001]
  # XGBoost: # Removed section
  #   default:
  #     n_estimators: [100]
  #     max_depth: [6]
  #     learning_rate: [0.1]
  LightGBM: 
    default:
      n_estimators: [100]
      num_leaves: [31]
      learning_rate: [0.1]
  # LightGBM: 
  #   default:
  #     n_estimators: [100]
  #     num_leaves: [31]
  #     learning_rate: [0.1]
  WaveKAN:
     default:
       wavelet_type: ['mexican_hat'] # Reduced grid for speed
       learning_rate: [0.001]
  FourierKAN:
     default:
       fourier_gridsize: [10]
       learning_rate: [0.001]
  # JacobiKAN:
  #   default:
  #     jacobi_degree: [5]
  #     learning_rate: [0.001]
  # ChebyKAN:
  #   default:
  #     cheby_degree: [5]
  #     learning_rate: [0.001]
  # TaylorKAN:
  #   default:
  #     taylor_order: [3]
  #     learning_rate: [0.001]
  # RBFKAN:
  #   default:
  #     rbf_num_centers: [50]
  #     learning_rate: [0.001]

# Fixed training settings
training:
  batch_size: 128
  optimizer: "AdamW"
  loss_function: "CrossEntropyLoss"
  device: "auto"
  early_stopping_patience: 3
  gbt_early_stopping_rounds: 10

logging:
  log_dir: "logs/mnist_compare_all_models"
  project_name: "QKAN_MNIST_Compare_All"
  use_wandb: False

plotting:
  plot_results: True
  plot_dir: "results/mnist_compare_all_models/plots"
  metric_name: "Accuracy" 