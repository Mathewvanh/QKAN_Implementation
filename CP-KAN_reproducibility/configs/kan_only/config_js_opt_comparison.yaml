# Configuration for KAN Optimization Comparison on Jane Street

experiment_name: "JaneStreet_OptimizationComparison"
random_seed: 42
num_epochs: 50
results_dir: "optimization_results_js" # Separate results dir
methods_to_run: ["FixedKAN"] # Specify the model type

dataset:
  name: "jane_street"
  task_type: "regression"
  data_path: "~/Interning/Kaggle/jane_street_kaggle/jane-street-real-time-market-data-forecasting/train.parquet/**/*.parquet"
  n_rows: 500000 # Limit rows for quicker runs
  train_ratio: 0.8
  feature_cols: "auto"
  target_col: "responder_6"
  weight_col: "weight"
  date_col: "date_id"
  primary_metric: "weighted_r2"
  optimize_sample_size: 50000

# Use structured parameter_grids even for single model runs
parameter_grids: 
  FixedKAN: # Grid specific to FixedKAN
    default:
      max_degree: [3, 5]
      hidden_size: [64, 128]
      learning_rate: [0.001, 0.0005]
    quick:
      max_degree: [3]
      hidden_size: [64]
      learning_rate: [0.001]

# List of KAN optimization methods to compare
kan_optimize_methods: ["QUBO", "GreedyHeuristic", "IntegerProgramming", "Evolutionary"] 

# Fixed training settings
training:
  batch_size: 4096
  optimizer: "AdamW"
  loss_function: "MSELoss"
  device: "auto"
  early_stopping_patience: 5
  gbt_early_stopping_rounds: 20 # Not used here, but harmless

logging:
  log_dir: "logs/js_opt_compare"
  project_name: "QKAN_JS_OptCompare"
  use_wandb: False

plotting:
  plot_results: True
  plot_dir: "optimization_results_js/plots"
  metric_name: "Weighted R2"
