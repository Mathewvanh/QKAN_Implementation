# Configuration for KAN Optimization Comparison on MNIST

experiment_name: "MNIST_KAN_OptComparison"
random_seed: 42
num_epochs: 30 # MNIST might converge faster
results_dir: "results_mnist"

dataset:
  name: "mnist"
  task_type: "classification"
  data_path: "./data" # Path where torchvision will download/look for MNIST

# Define model and parameters to search
model_type: "FixedKAN"

parameter_grid: # Grid specifically for FixedKAN on MNIST
  default:
    max_degree: [3, 5] # Lower degrees might be sufficient for MNIST
    hidden_size: [32, 64] # Larger hidden size for image features
    learning_rate: [0.005, 0.001]
  quick:
    max_degree: [3]
    hidden_size: [32]
    learning_rate: [0.001]

# List of KAN optimization methods to compare (optional, defaults to all)
# methods_to_run: ["QUBO", "GreedyHeuristic"] 